# Botox Project Configuration
# Settings here will override ~/.config/botox/config.yaml for this workspace.

document:
  author: "Minus"
  affiliation: "Systems Engineering"
  fontsize: "11pt"
  mainfont: "New Computer Modern"       # True LaTeX font
  mathfont: "New Computer Modern Math"  # True LaTeX math font
  monofont: "DejaVu Sans Mono"          # Monospace font
  papersize: "a4"                       # a4, letter
  columns: 1                            # 1 or 2
  margin:
    x: "2.5cm"
    y: "2.5cm"
  section_numbering: true              # Numbered sections: 1, 1.1
  toc: true                            # Auto-generate Table of Contents
  toc_depth: 3                         # Outline heading depth
  bibliography: true                   # Transform links into IEEE Bibliography
  lang: "en"
  linkcolor: "#0284c7"                 # Clean modern blue link color

slides:
  theme: "default"                     # default, academic, nord, dark
  paginate: true
  font: "New Computer Modern"
